<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Color Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <section class="hud">
    <div class="brand"><span>Color</span> Connect</div>
    <div class="level"><small>NÍVEL</small><b id="lvl">01</b></div>
    <div class="prog">
      <div class="prog-top"><small>PREENCHIDO</small><b id="pct">0%</b></div>
      <div class="track"><i id="bar"></i></div>
    </div>
    <div class="btns">
      <button class="btn" id="rst" title="Reiniciar" aria-label="Reiniciar">↻</button>
      <button class="btn hint" id="hnt" title="Dica" aria-label="Dica">💡</button>
    </div>
    <p class="info">Arraste de um ponto até o outro da mesma cor e preencha todas as casas.</p>
  </section>
  <section class="board" id="board"><canvas id="c"></canvas></section>
</main>
<div id="win"><div class="card"><small>SISTEMA</small><h2>NÍVEL COMPLETO</h2><button id="next">PRÓXIMO NÍVEL ▶</button></div></div>
<script src="script.js"></script>
</body>
</html>
